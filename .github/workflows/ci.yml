name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenantbudget
          POSTGRES_PASSWORD: tenantbudget
          POSTGRES_DB: tenantbudget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenantbudget"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TENANTBUDGET_TEST_DSN: postgresql://tenantbudget:tenantbudget@localhost:5432/tenantbudget_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  no-dependencies:
    # The core must import and work with nothing but the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: |
          python - <<'PY'
          from tenantbudget import Guard, Usage
          guard = Guard()
          guard.set_budget("acme", monthly_usd=1)
          r = guard.reserve("acme", "gpt-5.4", input_tokens=100, max_output_tokens=100)
          print(guard.settle(r, Usage(input_tokens=90, output_tokens=40)).cost_usd)
          PY
