# Publishes a release when a tag like v0.1.0 is pushed.
#
# Nothing here uses a long-lived secret. PyPI accepts the upload because the
# workflow proves its identity with a short-lived OIDC token ("trusted
# publishing"), and every artifact is signed with a Sigstore attestation that
# ties it to this repository, this workflow and the tagged commit.
#
# One-time setup:
#   1. On PyPI, add a trusted publisher for this repository with workflow
#      "release.yml" and environment "pypi".
#   2. In the repository settings, create an environment named "pypi"
#      (add required reviewers there if releases should need approval).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - name: Tag must match the package version
        run: |
          version=$(python -c "import glob,re; print(re.search(r'tenantbudget-(.+)\.tar\.gz', glob.glob('dist/*.tar.gz')[0]).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    # Test the built wheel, not the source tree: this is what users install.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenantbudget
          POSTGRES_PASSWORD: tenantbudget
          POSTGRES_DB: tenantbudget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenantbudget"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TENANTBUDGET_TEST_DSN: postgresql://tenantbudget:tenantbudget@localhost:5432/tenantbudget_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: pip install "$(ls dist/*.whl)[dev]"
      - run: rm -rf src && pytest -q

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing and signing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      # Uploads with PEP 740 attestations, which PyPI shows on the file pages.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
