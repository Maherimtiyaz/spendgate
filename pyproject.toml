[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenantbudget"
dynamic = ["version"]
description = "Per-tenant LLM spend metering and hard budgets, as a library. No proxy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "budget", "metering", "billing", "openai", "anthropic", "multi-tenant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Maherimtiyaz/spendgate"
Issues = "https://github.com/Maherimtiyaz/spendgate/issues"
Changelog = "https://github.com/Maherimtiyaz/spendgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[pool]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "openai>=1.40", "anthropic>=0.40", "psycopg[binary,pool]>=3.1",
       "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.hatch.version]
path = "src/tenantbudget/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenantbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
